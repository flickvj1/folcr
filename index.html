<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T.J. Maxx Reward – Claim Now</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            /* T.J. Maxx Signature Red Palette */
            --brand: #C41230;
            --brand-dark: #960920;
            --brand-light: #FDF2F4;
            --brand-shadow: rgba(196, 18, 48, 0.28);
            
            --text: #1a1a1a;
            --text-mid: #4a5568;
            --text-light: #8896a6;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --font: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 4vw;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            height: 100%;
            justify-content: center;
            gap: 2.2vh;
        }

        /* ── VOUCHER DESIGN ── */
        .voucher {
            width: 100%;
            background: #ffffff;
            border-radius: 14px;
            position: relative;
            box-shadow: 0 1vh 3.5vh rgba(196, 18, 48, 0.08), 0 2px 6px rgba(0,0,0,0.03);
            border: 2px dashed var(--border);
            padding: clamp(16px, 2.8vh, 24px);
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .voucher:hover {
            transform: translateY(-2px);
            border-color: #fca5a5;
            box-shadow: 0 1.4vh 4vh rgba(196, 18, 48, 0.12);
        }

        /* Punch hole cutouts */
        .voucher::before, .voucher::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 22px;
            height: 22px;
            background: var(--bg);
            border-radius: 50%;
            border: 2px dashed var(--border);
            z-index: 2;
        }

        .voucher::before {
            left: -13px;
            border-right-color: transparent;
            border-top-color: transparent;
            transform: translateY(-50%) rotate(45deg);
        }

        .voucher::after {
            right: -13px;
            border-left-color: transparent;
            border-bottom-color: transparent;
            transform: translateY(-50%) rotate(45deg);
        }

        .v-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.4vh;
        }

        .v-logo {
            height: clamp(30px, 5.2vh, 44px);
            max-width: 145px;
            object-fit: contain;
            display: block;
        }

        .v-badge {
            background: var(--brand-light);
            color: var(--brand);
            font-size: clamp(0.6rem, 1.2vh, 0.72rem);
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: 1px solid rgba(196, 18, 48, 0.15);
        }

        .v-mid {
            text-align: center;
            padding: 0.8vh 0;
        }

        .v-label {
            font-size: clamp(0.62rem, 1.3vh, 0.72rem);
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .v-amount {
            font-family: var(--font-mono);
            font-size: clamp(2.6rem, 5.2vh, 3.4rem);
            font-weight: 800;
            color: var(--brand);
            line-height: 1;
            letter-spacing: -1px;
        }

        .v-amount span {
            font-size: clamp(1.3rem, 2.6vh, 1.6rem);
            vertical-align: text-top;
            font-weight: 700;
            margin-right: 2px;
        }

        .v-bot {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 0.8vh;
        }

        .v-barcode {
            display: flex;
            gap: 2px;
            height: clamp(20px, 3.8vh, 26px);
            align-items: stretch;
            opacity: 0.65;
        }

        .v-barcode i {
            background: var(--text);
            border-radius: 1px;
        }

        .v-status {
            font-size: clamp(0.65rem, 1.3vh, 0.75rem);
            font-weight: 700;
            color: var(--brand);
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .v-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 2px rgba(196, 18, 48, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
        }

        /* ── TIMELINE STEPS ── */
        .steps {
            width: 100%;
            background: #ffffff;
            border-radius: 14px;
            padding: clamp(6px, 1.2vh, 12px) 22px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            flex-shrink: 1;
            position: relative;
        }

        .steps::before {
            content: '';
            position: absolute;
            left: 36px;
            top: clamp(24px, 3.5vh, 32px);
            bottom: clamp(24px, 3.5vh, 32px);
            width: 2px;
            background: var(--border);
            z-index: 0;
            opacity: 0.7;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: clamp(10px, 1.8vh, 14px) 0;
            position: relative;
            z-index: 1;
        }

        .step:not(:last-child) {
            border-bottom: 1px solid var(--bg);
        }

        .s-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--border);
            color: var(--text-mid);
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            z-index: 2;
        }

        .step:last-child .s-icon {
            background: var(--brand);
            border-color: var(--brand);
            color: #ffffff;
            box-shadow: 0 2px 8px var(--brand-shadow);
        }

        .s-txt {
            font-size: clamp(0.75rem, 1.6vh, 0.86rem);
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        /* ── CALL TO ACTION ── */
        .cta-wrap {
            width: 100%;
            text-align: center;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: clamp(14px, 2.4vh, 18px);
            font-size: clamp(0.95rem, 2vh, 1.08rem);
            font-weight: 700;
            color: #ffffff;
            background: var(--brand);
            border: none;
            border-radius: 100px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px var(--brand-shadow);
            min-height: clamp(50px, 6.8vh, 58px);
            margin-bottom: 8px;
        }

        .btn:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--brand-shadow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-txt {
            transition: opacity 0.2s ease;
        }

        .spinner {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: spin 0.8s linear infinite;
        }

        .btn.loading .btn-txt {
            opacity: 0;
        }

        .btn.loading .spinner {
            opacity: 1;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .note {
            font-size: clamp(0.6rem, 1.2vh, 0.72rem);
            color: var(--text-light);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            <!-- Voucher Card -->
            <div class="voucher">
                <div class="v-top">
                    <!-- T.J. Maxx Vector Logo with inline fallback -->
                    <img 
                        src="https://www.logo.wine/a/logo/TJ_Maxx/TJ_Maxx-Logo.wine.svg" 
                        alt="T.J. Maxx Logo" 
                        class="v-logo"
                        onerror="this.onerror=null; this.parentElement.innerHTML='<svg width=\'120\' height=\'32\' viewBox=\'0 0 140 36\' fill=\'none\' xmlns=\'http://www.w3.org/2000/svg\'><text x=\'2\' y=\'26\' font-family=\'Inter, sans-serif\' font-weight=\'900\' font-size=\'24\' fill=\'%23C41230\' letter-spacing=\'-0.5\'>T.j.maxx</text></svg><div class=\'v-badge\'>Reward</div>';"
                    >
                    <div class="v-badge">Reward</div>
                </div>

                <div class="v-mid">
                    <div class="v-label">Reward Balance</div>
                    <div class="v-amount"><span>$</span>500</div>
                </div>

                <div class="v-bot">
                    <div class="v-barcode">
                        <i style="width: 2px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 3px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 3px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 1px"></i>
                    </div>
                    <div class="v-status">ACTIVE</div>
                </div>
            </div>

            <!-- Step-by-Step Instructions -->
            <div class="steps">
                <div class="step">
                    <div class="s-icon">1</div>
                    <div class="s-txt">Click the button below</div>
                </div>
                <div class="step">
                    <div class="s-icon">2</div>
                    <div class="s-txt">Enter your email &amp; basic info</div>
                </div>
                <div class="step">
                    <div class="s-icon">3</div>
                    <div class="s-txt">Complete 4 to 5 required deals</div>
                </div>
                <div class="step">
                    <div class="s-icon">4</div>
                    <div class="s-txt">Receive your reward once verified</div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="cta-wrap">
                <button class="btn" id="claim-btn">
                    <span class="btn-txt">Claim Reward</span>
                    <span class="spinner"></span>
                </button>
                <div class="note">Available in US, CA, AU, UK</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const claimBtn = document.getElementById('claim-btn');
        const targetUrl = 'https://trksy.org/aff_c?offer_id=2914&aff_id=171242';

        claimBtn.addEventListener('click', function() {
            if (claimBtn.classList.contains('loading')) return;
            claimBtn.classList.add('loading');

            setTimeout(function() {
                window.location.href = targetUrl;
            }, 800);
        });
    })();
    </script>
</body>
</html>
